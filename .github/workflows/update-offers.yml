name: Update Campaign Offers

on:
  schedule:
    # cronはUTC基準。日本時間 0:00 / 12:00 / 21:00 に対応。
    - cron: "0 15 * * *" # 日本時間 0:00
    - cron: "0 3 * * *"  # 日本時間 12:00
    - cron: "0 12 * * *" # 日本時間 21:00
  workflow_dispatch: {} # 手動実行もできるようにしておく

jobs:
  update-offers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run offer update script
        run: node scripts/update-offers.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
